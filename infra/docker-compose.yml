services:
  pedro-postgres:
    image: postgres:16
    container_name: pedro-canar-postgres
    environment:
      POSTGRES_USER: canar
      POSTGRES_PASSWORD: canar
      POSTGRES_DB: canar
    ports:
      - "5450:5432"
    volumes:
      - pedro-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canar -d canar"]
      interval: 5s
      timeout: 3s
      retries: 20

  pedro-qdrant:
    image: qdrant/qdrant:latest
    container_name: pedro-canar-qdrant
    ports:
      - "6350:6333"
      - "6351:6334"
    volumes:
      - pedro-qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pedro-pgdata:
  pedro-qdrantdata:
